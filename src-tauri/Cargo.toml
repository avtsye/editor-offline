[package]
name = "editor_offline"
version = "0.1.0"
description = "An independent offline-first code editor"
authors = ["Editor Offline contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "editor_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
